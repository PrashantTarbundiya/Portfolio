<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="60%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <radialGradient id="limeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8ff00" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8ff00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  
  <!-- Ambient Glow Blobs -->
  <circle cx="1020" cy="180" r="420" fill="url(#limeGlow)"/>
  <circle cx="180" cy="500" r="380" fill="url(#cyanGlow)"/>

  <!-- Glass Card Outer Frame -->
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="#0f131d" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top Laser Flare -->
  <rect x="70" y="70" width="1060" height="2" fill="#c8ff00" opacity="0.6"/>

  <!-- Brand Pill Badge -->
  <rect x="130" y="130" width="310" height="38" rx="19" fill="#1b212f" stroke="#c8ff00" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="152" cy="149" r="5" fill="#c8ff00"/>
  <text x="168" y="154" font-family="monospace" font-weight="700" font-size="13" fill="#c8ff00" letter-spacing="1.5">PRODUCTION SYSTEMS ENGINEER</text>

  <!-- Headline -->
  <text x="130" y="240" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="58" fill="url(#textGrad)" letter-spacing="-1">Prashant Tarbundiya</text>

  <!-- Subtitle -->
  <text x="130" y="300" font-family="monospace" font-weight="600" font-size="26" fill="#c8ff00">Full Stack Developer &amp; Distributed Systems</text>

  <!-- Key Credential Highlights -->
  <text x="130" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="20" fill="#94a3b8">B.Tech CSE @ Nirma University (CGPA 9.08) • Winter 2027 &amp; Full-Time</text>
  <text x="130" y="405" font-family="monospace" font-weight="500" font-size="16" fill="#64748b">Flagship Systems: AuraPass (90° Yaw Biometrics) • LabPortal • MakeChat • PlayBack</text>

  <!-- Tech Tags Footer Row -->
  <rect x="130" y="455" width="115" height="32" rx="10" fill="#161b26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="187" y="475" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">C++ / Python</text>

  <rect x="255" y="455" width="130" height="32" rx="10" fill="#161b26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="320" y="475" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">React &amp; Node.js</text>

  <rect x="395" y="455" width="110" height="32" rx="10" fill="#161b26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="450" y="475" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">PostgreSQL</text>

  <rect x="515" y="455" width="125" height="32" rx="10" fill="#161b26" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <text x="577" y="475" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Docker &amp; AWS</text>

  <!-- CTA Pill Button -->
  <rect x="880" y="450" width="190" height="42" rx="21" fill="#c8ff00"/>
  <text x="975" y="476" font-family="monospace" font-weight="800" font-size="14" fill="#08090d" text-anchor="middle">EXPLORE CODE →</text>
</svg>
